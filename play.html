<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="VELA. Paint to play.">
    <meta name="author" content="Fernando Álvarez">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://discosenvela.com/play">
    <meta property="og:title" content="VELA">
    <meta property="og:description" content="Paint to play.">
    <meta property="og:image" content="https://discosenvela.com/img/og-play.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="VELA">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://discosenvela.com/play">
    <meta name="twitter:title" content="VELA">
    <meta name="twitter:description" content="Paint to play.">
    <meta name="twitter:image" content="https://discosenvela.com/img/og-play.jpg">

    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">

    <!-- Preload critical fonts -->
    <link rel="preload" href="fonts/BeatriceRegular.woff" as="font" type="font/woff" crossorigin>

    <title>VELA</title>

    <!-- Custom CSS -->
    <link href="css/vela.css" rel="stylesheet">
    <link href="css/play.css" rel="stylesheet">
</head>

<body class="play-page">
    <canvas id="field" aria-hidden="true"></canvas>
    <canvas id="paint" aria-label="Paint here to play"></canvas>
    <div id="playhead" aria-hidden="true"></div>
    <div id="brush" aria-hidden="true"></div>

    <header>
        <div class="logo"><a href="/">
            <img class="logo-out" src="img/logo.svg"
                 alt="VELA logo">
            <img class="logo-in" src="img/logo_aux.svg"
                 alt="VELA logo hover">
        </a></div>
        <h1>&nbsp<a href="/releases">/ Releases</a></h1>
        <h1>&nbsp<a href="/tapes">/ Tapes</a></h1>
        <h1>&nbsp<a href="/information">/ Information</a></h1>
    </header>

    <p id="cue">Paint to play</p>
    <p id="flash" role="status"></p>

    <aside id="tools">
        <div id="swatches"></div>
        <button type="button" id="thinner" aria-label="Thinner">−</button>
        <span id="size" aria-hidden="true"></span>
        <button type="button" id="thicker" aria-label="Thicker">+</button>
        <span id="key"></span>
        <span id="meter" title="Layers playing"></span>
        <span id="layers"></span>
        <button type="button" id="help" aria-label="Keys">?</button>
        <div id="keys" hidden>
            <span class="row"><kbd>1–5</kbd><span>color</span></span>
            <span class="row"><kbd>[ ]</kbd><span>width</span></span>
            <button type="button" class="row" data-action="undo"><kbd>Z</kbd><span>undo</span></button>
            <button type="button" class="row" data-action="clear"><kbd>C</kbd><span>clear</span></button>
            <button type="button" class="row" data-action="reroll"><kbd>N</kbd><span>new drone</span></button>
            <button type="button" class="row" data-action="mute"><kbd>M</kbd><span id="mute-label">mute</span></button>
            <button type="button" class="row" data-action="save"><kbd>S</kbd><span>save image</span></button>
            <button type="button" class="row" data-action="record"><kbd>R</kbd><span id="record-label">record sound</span></button>
            <button type="button" class="row" data-action="hide"><kbd>H</kbd><span>hide panel</span></button>
            <button type="button" class="row" data-action="fade" aria-pressed="true"><kbd>P</kbd><span>paint <u id="fade">fades</u></span></button>
        </div>
    </aside>
    <button type="button" id="bare-toggle" aria-label="Show or hide the panel"></button>

    <footer>
        © 2026 <a href="mailto:discosenvela@gmail.com" target="_blank" rel="noopener noreferrer">@discosenvela</a> /
          <a href="https://instagram.com/discosenvela" target="_blank" rel="noopener noreferrer">Instagram</a> /
          <a href="https://soundcloud.com/discosenvela" target="_blank" rel="noopener noreferrer">SoundCloud</a> /
          <a href="https://discosenvela.bandcamp.com" target="_blank" rel="noopener noreferrer">Bandcamp</a>
    </footer>

    <script type="module" src="js/play/main.js"></script>
</body>
</html>
